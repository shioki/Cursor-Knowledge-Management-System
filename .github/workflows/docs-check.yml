name: Docs checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 月曜 06:00 UTC — 外部ドキュメント URL の変化を main の有無に依存せず検知
    - cron: "0 6 * * 1"

jobs:
  docs-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Docs check
        run: npm run docs:check

  skill-publish-dry-run:
    # gh skill が受理する形式かを配布前に確認する。gh は GitHub Actions ランナーに標準搭載。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "::warning::gh skill サブコマンドが利用できないためスキップしました"
          fi

  setup-smoke-test:
    # init.sh が実際に動き、validate.sh が通る構成を作れることを確認する。
    # v5 では templates の複製が drift しても CI が気づかなかった。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run init.sh into a fresh directory
        run: |
          mkdir -p /tmp/ckms-target
          bash skills/project-setup/scripts/init.sh /tmp/ckms-target --yes

      - name: Re-run init.sh without deleting user records
        run: |
          bash scripts/smoke-init-rerun.sh /tmp/ckms-target .agents -- \
            bash skills/project-setup/scripts/init.sh /tmp/ckms-target --yes
          mkdir -p /tmp/ckms-legacy /tmp/ckms-cursor
          bash skills/project-setup/scripts/init.sh /tmp/ckms-legacy --yes --legacy-claude --no-hooks --no-agents
          bash scripts/smoke-init-rerun.sh /tmp/ckms-legacy .claude -- \
            bash skills/project-setup/scripts/init.sh /tmp/ckms-legacy --yes --legacy-claude --no-hooks --no-agents
          bash skills/project-setup/scripts/init.sh /tmp/ckms-cursor --yes --cursor-only --no-hooks --no-agents
          bash scripts/smoke-init-rerun.sh /tmp/ckms-cursor .cursor -- \
            bash skills/project-setup/scripts/init.sh /tmp/ckms-cursor --yes --cursor-only --no-hooks --no-agents
          # 導入先の init.sh をその導入先へ向けて実行すると、配布元と導入先が同じになる
          (
            cd /tmp/ckms-target
            if bash .agents/skills/project-setup/scripts/init.sh . --yes; then
              echo "::error::self-targeted init.sh should fail"
              exit 1
            fi
            test -d .agents/skills/add-pattern
            if bash .claude/skills/project-setup/scripts/init.sh . --yes; then
              echo "::error::self-targeted init.sh via .claude/skills should fail"
              exit 1
            fi
            test -d .agents/skills/add-pattern
          )
          # 配布元だけにある新規ファイルが残り、利用者のファイルが優先される
          upstream="skills/knowledge-management/references/decisions/UPSTREAM_ONLY.md"
          cleanup_upstream() { rm -f "$upstream"; }
          trap cleanup_upstream EXIT
          echo from-upstream > "$upstream"
          decisions=/tmp/ckms-target/.agents/skills/knowledge-management/references/decisions
          echo marker-user >> "$decisions/README.md"
          echo kept-user > "$decisions/user-only.md"
          bash skills/project-setup/scripts/init.sh /tmp/ckms-target --yes
          grep -q marker-user "$decisions/README.md"
          grep -q kept-user "$decisions/user-only.md"
          grep -q from-upstream "$decisions/UPSTREAM_ONLY.md"
          rm -f "$upstream"
          trap - EXIT
          # 退避中のコピーが失敗したら、導入先を消す前に退避先を表示する
          fail=$(mktemp -d)
          bash skills/project-setup/scripts/init.sh "$fail" --yes --no-backup --no-hooks --no-agents
          secret="$fail/.agents/skills/knowledge-management/references/decisions/secret.md"
          echo secret > "$secret"
          chmod 000 "$secret"
          set +e
          out=$(bash skills/project-setup/scripts/init.sh "$fail" --yes --no-backup --no-hooks --no-agents 2>&1)
          code=$?
          set -e
          chmod 644 "$secret" 2>/dev/null || true
          if [ "$code" -eq 0 ] || ! printf '%s\n' "$out" | grep -q '退避先'; then
            echo "::error::failed replace did not report the preserved-data directory"
            printf '%s\n' "$out"
            exit 1
          fi
          test -f "$secret"
          # 記録ディレクトリがシンボリックリンクなら、リンクのまま残す
          linked=$(mktemp -d)
          shared=$(mktemp -d)
          bash skills/project-setup/scripts/init.sh "$linked" --yes --no-hooks --no-agents
          decisions="$linked/.agents/skills/knowledge-management/references/decisions"
          cp -a "$decisions/." "$shared/"
          rm -rf "$decisions"
          ln -s "$shared" "$decisions"
          echo kept-shared > "$shared/shared-only.md"
          bash skills/project-setup/scripts/init.sh "$linked" --yes --no-hooks --no-agents
          if [ ! -L "$decisions" ]; then
            echo "::error::symlinked decisions/ was replaced by a directory"
            exit 1
          fi
          grep -q kept-shared "$shared/shared-only.md"
          # 退避先の除外が無い古い .cursorignore には、追加する行を案内する
          grep -v 'skills\.backup-' "$linked/.cursorignore" > "$linked/.cursorignore.old"
          mv "$linked/.cursorignore.old" "$linked/.cursorignore"
          out=$(bash skills/project-setup/scripts/init.sh "$linked" --yes --no-backup --no-hooks --no-agents)
          if ! printf '%s\n' "$out" | grep -q '^    \.agents/skills\.backup-\*/$'; then
            echo "::error::init.sh did not suggest the skills.backup-* ignore lines"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Validate the generated structure
        working-directory: /tmp/ckms-target
        run: bash .agents/skills/project-setup/scripts/validate.sh

      - name: Run the installed hooks and session search
        run: bash scripts/smoke-hooks.sh /tmp/ckms-target

      - name: Verify the Claude Code skills bridge resolves
        # .agents/skills が Claude Code から直接は探索されないため、init.sh が作る
        # .claude/skills シンボリックリンクが実際に 13 スキルを解決できるか確認する。
        working-directory: /tmp/ckms-target
        run: |
          if [ ! -L ".claude/skills" ]; then
            echo "::error::.claude/skills is not a symlink"
            exit 1
          fi
          count=$(find -L .claude/skills -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "::error::.claude/skills resolved to 0 skill directories"
            exit 1
          fi
          echo "resolved $count skill directories via .claude/skills"

      - name: Exercise the knowledge scripts
        working-directory: /tmp/ckms-target
        run: |
          S=.agents/skills
          bash $S/knowledge-management/scripts/add-entry.sh "Adopt PostgreSQL"
          bash $S/knowledge-management/scripts/add-entry.sh "日本語のみのタイトル"
          bash $S/pattern-library/scripts/add-pattern.sh "Retry with backoff"
          bash $S/improvement-tracking/scripts/add-improvement.sh "Reduce bundle size"
          bash $S/debug-workflow/scripts/create-session.sh "認証タイムアウト"

      - name: Reject empty slugs
        # 日本語のみのタイトルでスラッグが空になり、ファイル名が壊れる回帰を防ぐ
        working-directory: /tmp/ckms-target
        run: |
          malformed=$(find .agents -name '*.md' \( -name '*-.md' -o -name '*_.md' \) -print)
          if [ -n "$malformed" ]; then
            echo "::error::empty slug produced malformed filenames: $malformed"
            exit 1
          fi

      - name: Escape special characters in titles
        # | : " 改行を含むタイトルで frontmatter と索引表が壊れないことを確認する
        working-directory: /tmp/ckms-target
        run: |
          S=.agents/skills
          TITLE=$(printf 'Use cache | fallback: sync "mode"\nline2')
          bash $S/knowledge-management/scripts/add-entry.sh "$TITLE"
          bash $S/pattern-library/scripts/add-pattern.sh "$TITLE"
          bash $S/improvement-tracking/scripts/add-improvement.sh "$TITLE"

          fail=0
          for f in \
            "$S/knowledge-management/references/decisions/"*-use-cache-fallback-sync-mode-line2.md \
            "$S/pattern-library/references/patterns/use-cache-fallback-sync-mode-line2.md" \
            "$S/improvement-tracking/references/improvements/"*-use-cache-fallback-sync-mode-line2.md
          do
            if ! grep -q '^title: "Use cache | fallback: sync \\"mode\\" line2"$' "$f"; then
              echo "::error::broken frontmatter title in $f"
              sed -n '1,10p' "$f"
              fail=1
            fi
          done

          for idx in \
            "$S/knowledge-management/references/decisions/README.md" \
            "$S/pattern-library/references/patterns/README.md" \
            "$S/improvement-tracking/references/improvements/README.md"
          do
            # 表の行は 3 列（先頭・末尾の | を除きセルが 3 つ）。\| は列区切りに数えない
            bad=$(grep -E '^\| .* \| .* \| .* \|' "$idx" | while IFS= read -r line; do
              cells=$(printf '%s' "$line" | sed 's/\\|/<PIPE>/g' | awk -F'|' '{print NF-2}')
              [ "$cells" = "3" ] || echo "$line"
            done)
            if [ -n "$bad" ]; then
              echo "::error::malformed table row(s) in $idx:"
              printf '%s\n' "$bad"
              fail=1
            fi
            if ! grep -q 'Use cache \\| fallback: sync "mode" line2' "$idx"; then
              echo "::error::escaped title not found in index $idx"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ]

      - name: Run hooks against the generated project
        working-directory: /tmp/ckms-target
        run: |
          echo '{"session_id":"ci"}' | .cursor/hooks/inject-knowledge-index.sh | tee /tmp/hook-out.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/hook-out.json','utf8'))"
          echo "{\"file_path\":\"$PWD/src/app.ts\"}" | .cursor/hooks/log-activity.sh
          echo '{"status":"completed","loop_count":0}' | .cursor/hooks/suggest-record.sh

      - name: Run Claude Code hooks against the generated project
        working-directory: /tmp/ckms-target
        run: |
          echo '{"session_id":"ci"}' | .claude/hooks/claude-code/session-start.sh | tee /tmp/claude-hook-out.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/claude-hook-out.json','utf8'))"
          echo "{\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"$PWD/src/app.ts\"}}" | .claude/hooks/claude-code/post-tool-use-log-activity.sh
          echo '{"status":"completed"}' | .claude/hooks/claude-code/stop-suggest-record.sh
          node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"

  windows-setup-smoke-test:
    # init.ps1 は setup-smoke-test（ubuntu-latest）では一度も実行されない。
    # Windows 固有の不具合（symlink 権限、Copy-Item が実行ビットを引き継がない等）は
    # ここでしか検知できないため、windows-latest 上で実際に実行して検証する。
    # windows-latest ランナーは Git Bash（C:\Program Files\Git\bin\bash.exe）を標準搭載。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run init.ps1 into a fresh directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\ckms-target | Out-Null
          .\skills\project-setup\scripts\init.ps1 -TargetPath C:\ckms-target -Yes

      - name: Re-run init.ps1 without deleting user records
        shell: bash
        run: |
          bash scripts/smoke-init-rerun.sh "C:/ckms-target" .agents -- \
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/skills/project-setup/scripts/init.ps1" -TargetPath 'C:\ckms-target' -Yes

      - name: Keep a junctioned records directory on re-run
        shell: pwsh
        run: |
          $target = 'C:\ckms-junction'
          $shared = 'C:\ckms-shared'
          New-Item -ItemType Directory -Force -Path $target, $shared | Out-Null
          .\skills\project-setup\scripts\init.ps1 -TargetPath $target -Yes -NoHooks -NoAgents
          $decisions = Join-Path $target '.agents\skills\knowledge-management\references\decisions'
          Copy-Item -Path (Join-Path $decisions '*') -Destination $shared -Recurse -Force
          Remove-Item -LiteralPath $decisions -Recurse -Force
          New-Item -ItemType Junction -Path $decisions -Target $shared | Out-Null
          Set-Content -LiteralPath (Join-Path $shared 'shared-only.md') -Value 'kept-shared'
          .\skills\project-setup\scripts\init.ps1 -TargetPath $target -Yes -NoHooks -NoAgents
          $item = Get-Item -LiteralPath $decisions -Force
          if ([string]$item.LinkType -ne 'Junction') { throw "junctioned decisions/ was replaced: $($item.LinkType)" }
          if (-not (Test-Path -LiteralPath (Join-Path $shared 'shared-only.md'))) { throw "shared records were deleted" }
          if (-not (Test-Path -LiteralPath (Join-Path $shared 'README.md'))) { throw "shared README.md was deleted" }
          $backup = @(Get-ChildItem -LiteralPath (Join-Path $target '.agents') -Directory -Filter 'skills.backup-*')
          if ($backup.Count -lt 1) { throw "backup was not created" }

      - name: Run init.ps1 on Windows PowerShell 5.1
        # Windows 標準の PowerShell。BOM の無い .ps1 は ANSI として読まれ、
        # Set-Content -Encoding UTF8 は BOM を付ける。どちらも pwsh では起きない。
        shell: powershell
        run: |
          $target = 'C:\ckms-ps51'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          .\skills\project-setup\scripts\init.ps1 -TargetPath $target -Yes -WithAgentsMd
          $marker = Join-Path $target '.agents\skills\knowledge-management\references\decisions\user-only.md'
          Set-Content -LiteralPath $marker -Value 'kept-user'
          .\skills\project-setup\scripts\init.ps1 -TargetPath $target -Yes
          if (-not (Test-Path -LiteralPath $marker)) { throw "re-run on 5.1 deleted user records" }
          foreach ($rel in @('.cursor\hooks.json', 'CLAUDE.md')) {
            $path = Join-Path $target $rel
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$rel was written with a UTF-8 BOM"
            }
          }
          Get-Content -Raw -LiteralPath (Join-Path $target '.cursor\hooks.json') | ConvertFrom-Json | Out-Null
          $claudeMd = (Get-Content -Raw -LiteralPath (Join-Path $target 'CLAUDE.md')).Trim()
          if ($claudeMd -ne '@AGENTS.md') { throw "unexpected CLAUDE.md: $claudeMd" }

      - name: Restore the skill when init.ps1 is interrupted (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-init-ps-interrupt.ps1 -TargetPath C:\ckms-interrupt-7

      - name: Restore the skill when init.ps1 is interrupted (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-init-ps-interrupt.ps1 -TargetPath C:\ckms-interrupt-51

      - name: Reject self-targeted init.ps1
        shell: pwsh
        working-directory: C:\ckms-target
        run: |
          function Assert-SelfInitFails([string]$ScriptPath) {
            $failed = $false
            try {
              & $ScriptPath -TargetPath 'C:\ckms-target' -Yes
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            } catch {
              $failed = $true
            }
            if (-not $failed) { throw "self-targeted init.ps1 should fail: $ScriptPath" }
            if (-not (Test-Path 'C:\ckms-target\.agents\skills\add-pattern')) {
              throw "skills were removed by $ScriptPath"
            }
          }
          Assert-SelfInitFails (Resolve-Path '.\.agents\skills\project-setup\scripts\init.ps1')
          $bridge = Get-Item '.\.claude\skills' -Force -ErrorAction SilentlyContinue
          if ($bridge -and ($bridge.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            Assert-SelfInitFails (Resolve-Path '.\.claude\skills\project-setup\scripts\init.ps1')
            # init.ps1 が作る橋渡しは絶対パスなので、相対リンクを作り直して確認する。
            # コピーで代用されたディレクトリには rmdir しない。
            cmd /c rmdir "C:\ckms-target\.claude\skills"
            New-Item -ItemType SymbolicLink -Path 'C:\ckms-target\.claude\skills' -Target '..\.agents\skills' | Out-Null
            Assert-SelfInitFails (Resolve-Path 'C:\ckms-target\.claude\skills\project-setup\scripts\init.ps1')
          }

      - name: Validate the generated structure (Git Bash)
        # working-directory は Windows パス。Git Bash の /c/... は CreateProcess に渡せない
        shell: bash
        working-directory: C:\ckms-target
        run: bash .agents/skills/project-setup/scripts/validate.sh

      - name: Run the installed hooks and session search (Git Bash)
        # $PWD が /c/ckms-target になるので、C:\... 形式のパスの変換も確かめる
        shell: bash
        run: bash scripts/smoke-hooks.sh C:/ckms-target

      - name: Verify the Claude Code skills bridge resolves
        shell: bash
        working-directory: C:\ckms-target
        run: |
          if [ ! -e ".claude/skills" ]; then
            echo "::error::.claude/skills was not created"
            exit 1
          fi
          count=$(find -L .claude/skills -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "::error::.claude/skills resolved to 0 skill directories"
            exit 1
          fi
          echo "resolved $count skill directories via .claude/skills (symlink or copy fallback)"

      - name: Run hooks directly (verifies Copy-Item + chmod preserved executability)
        # bash script.sh ではなく直接実行することで、init.ps1 が実行権限を
        # 正しく付与できているかも同時に検証する。
        shell: bash
        working-directory: C:\ckms-target
        run: |
          echo '{"session_id":"ci"}' | ./.cursor/hooks/inject-knowledge-index.sh | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
          echo '{"session_id":"ci"}' | ./.claude/hooks/claude-code/session-start.sh | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
          echo "{\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"$PWD/src/app.ts\"}}" | ./.claude/hooks/claude-code/post-tool-use-log-activity.sh
          node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"
