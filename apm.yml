# Microsoft APM (Agent Package Manager) manifest
# https://github.com/microsoft/apm
#
# This repository itself is publishable as an APM package. Other projects can
# install the entire skill set with:
#
#   apm install shioki/Cursor-Knowledge-Management-System#v6.0.0
#
# Or pick individual skills:
#
#   apm install shioki/Cursor-Knowledge-Management-System/skills/knowledge-management
#
name: cursor-knowledge-management-system
version: 6.0.0
description: "Cursor / Claude Code / Codex 共用。Agent Skills 13 種で技術判断・パターン・デバッグ・改善活動を蓄積。知識キュレーター subagent と記録支援 hooks を同梱。"
author: shioki
license: MIT
homepage: https://github.com/shioki/Cursor-Knowledge-Management-System

# このパッケージが提供するコンポーネントの配置
# v6.0.0: 非隠しディレクトリをリポジトリ直下に置き、Cursor Plugin のデフォルト探索と
#         gh skill の探索（--allow-hidden-dirs 不要）の両方をそのまま通す。
paths:
  skills: skills
  agents: agents
  hooks: hooks

# このパッケージ自身は外部パッケージに依存しない（純粋なスキル集）
# 利用側は apm.yml から必要なスキルだけを個別に install することも可能
dependencies:
  apm: []

# APM audit / security scan 向けメタデータ
metadata:
  tags:
    - knowledge-management
    - skills
    - subagents
    - hooks
    - cursor
    - claude-code
    - codex
  compatibility:
    cursor: ">=3.0.0"
    claude-code: ">=1.0.0"
    codex: "*"
